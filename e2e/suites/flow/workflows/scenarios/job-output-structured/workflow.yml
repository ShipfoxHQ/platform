name: Structured job output
runner: __RUNNER_LABEL__
triggers:
  on_push:
    source: __GITEA_SOURCE__
    event: push
    filter: 'event.ref == "refs/heads/main" && event.repository.full_name == "__GITEA_REPOSITORY__"'
jobs:
  review:
    steps:
      - key: inspect
        run: printf 'findings=%s\n' '[{"severity":"high"}]' >> "$SHIPFOX_OUTPUT"
        outputs:
          findings:
            type: json
            schema:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - severity
                properties:
                  severity:
                    type: string
    outputs:
      findings: ${{ steps.inspect.outputs.findings }}
  summarize:
    needs: review
    steps:
      - key: consume
        run: |
          test "${{ jobs.review.outputs.findings[0].severity }}" = high
          echo "structured severity=${{ jobs.review.outputs.findings[0].severity }}"
