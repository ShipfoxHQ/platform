# The shipped .network file matches an interface family, not one interface, so a machine with a
# second Ethernet link has two managed links that both count as required. The stock wait blocks
# until every required link is routable, which lets an attached-but-unconfigured link hold the
# boot open until its timeout. One routable uplink is all the runner needs.
#
# The bound matters as much as the semantics. Without it this unit is what wedges a failing
# instance for 90 seconds on the way back down.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
