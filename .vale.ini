StylesPath = tools/prose-policy/styles
MinAlertLevel = suggestion
Vocab = Shipfox
# Google v0.7.0 and Microsoft v0.15.0 are vendored with the prose-policy tool
# for offline CI.

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Google, Microsoft, Shipfox
# JSX tags carry UI copy in attributes. The tag itself is not prose.
TokenIgnores = (<(?!\!--)[^>]+>)
# Vale.Terms would enforce capitalization for every vocabulary entry. The project
# vocabulary supplies exceptions to the selected styles instead.
Vale.Terms = NO
# Shipfox.Spelling reports the repository vocabulary at warning level.
Vale.Spelling = NO
# The shorter procedural limit is enabled only for how-to, getting-started,
# and tutorial pages below.
Shipfox.SentenceLengthProcedural = NO

# Google rules that conflict with WRITING.md or have a measured false positive.
# Google.Contractions: WRITING.md prefers negative contractions only.
Google.Contractions = NO
# Google.Semicolons: the em dash replacement table prescribes semicolons.
Google.Semicolons = NO
# Google.Parens: the em dash replacement table prescribes parentheses.
Google.Parens = NO
# Google.WordList: Google-specific vocabulary is not the project vocabulary.
Google.WordList = NO
# Google.WordListCase: Google-specific casing flags product states such as disable.
Google.WordListCase = NO
# Google.Quotes: literal values in technical prose need their original punctuation.
Google.Quotes = NO
# Google.EmDash: this only regulates spacing; Shipfox.EmDash bans both dash code points.
Google.EmDash = NO
# Google.Spelling: its four-token dictionary misses the measured project spellings.
Google.Spelling = NO
# Google.OxfordComma: this is a style preference, not a repository requirement.
Google.OxfordComma = NO
# Google.Jargon: Shipfox.PlainWords owns the locally measured vocabulary.
Google.Jargon = NO
# Google.Colons: the rule flags proper nouns after bold labels in the corpus.
Google.Colons = NO
# The project vocabulary rules apply only where the writing guide asks for them.
# Google.Acronyms is enabled again for the product documentation section below.
Google.Acronyms = NO
# Google.Timeless is scoped to product documentation, where roadmap language signals drift.
Google.Timeless = NO
# Passive voice is useful in reference pages when the actor is irrelevant.
Google.Passive = suggestion

# Microsoft contributes one rule. Every other packaged rule was evaluated and rejected.
# Microsoft.AMPM: Google.AMPM owns this repository-wide date convention.
Microsoft.AMPM = NO
# Microsoft.Accessibility: disabled feature states are valid product vocabulary.
Microsoft.Accessibility = NO
# Microsoft.Acronyms: Google.Acronyms owns the scoped glossary rule.
Microsoft.Acronyms = NO
# Microsoft.Adverbs: adverbs such as safely and deliberately carry technical meaning.
Microsoft.Adverbs = NO
# Microsoft.Auto: this rule is outside WRITING.md and has no adopted project contract.
Microsoft.Auto = NO
# Microsoft.Avoid: the local Shipfox word rules own the measured avoid list.
Microsoft.Avoid = NO
# Microsoft.BiasFree: the repository has no measured need for this broader vocabulary.
Microsoft.BiasFree = NO
# Microsoft.Contractions: WRITING.md prefers negative contractions and expands the rest.
Microsoft.Contractions = NO
# Microsoft.Dashes: Shipfox.EmDash owns the repository dash ban.
Microsoft.Dashes = NO
# Microsoft.DateFormat: technical date values follow their owning API or product contract.
Microsoft.DateFormat = NO
# Microsoft.DateNumbers: technical date values follow their owning API or product contract.
Microsoft.DateNumbers = NO
# Microsoft.DateOrder: technical date values follow their owning API or product contract.
Microsoft.DateOrder = NO
# Microsoft.Ellipses: the repository does not adopt this punctuation preference.
Microsoft.Ellipses = NO
# Microsoft.ExclamationPoints: user-facing copy may use exclamation marks when context requires them.
Microsoft.ExclamationPoints = NO
# Microsoft.FirstPerson: the repository standard does not ban first-person technical prose.
Microsoft.FirstPerson = NO
# Microsoft.Foreign: technical names and quoted values are valid repository vocabulary.
Microsoft.Foreign = NO
# Microsoft.Gender: the repository does not adopt this broader vocabulary rule.
Microsoft.Gender = NO
# Microsoft.GenderBias: the repository does not adopt this broader vocabulary rule.
Microsoft.GenderBias = NO
# Microsoft.GeneralURL: URL is the project term and must not be rewritten to address.
Microsoft.GeneralURL = NO
# Microsoft.HeadingAcronyms: headings use the house glossary and product names.
Microsoft.HeadingAcronyms = NO
# Microsoft.HeadingColons: the repository permits colons in headings where the structure needs one.
Microsoft.HeadingColons = NO
# Microsoft.HeadingPunctuation: heading punctuation is not a repository-wide requirement.
Microsoft.HeadingPunctuation = NO
# Microsoft.Headings: Google.Headings supplies the adopted heading rule.
Microsoft.Headings = NO
# Microsoft.Jargon: Shipfox.PlainWords owns the locally measured vocabulary.
Microsoft.Jargon = NO
# Microsoft.Militaristic: security documentation uses attacker terminology precisely.
Microsoft.Militaristic = NO
# Microsoft.Negative: WRITING.md defines the repository contraction rule.
Microsoft.Negative = NO
# Microsoft.Ordinal: Google.Ordinal supplies the adopted ordinal rule.
Microsoft.Ordinal = NO
# Microsoft.OxfordComma: this is a style preference, not a repository requirement.
Microsoft.OxfordComma = NO
# Microsoft.Passive: Google.Passive supplies the adopted passive-voice scope.
Microsoft.Passive = NO
# Microsoft.Percentages: technical values follow their owning API or product contract.
Microsoft.Percentages = NO
# Microsoft.Plurals: the repository does not adopt this broader vocabulary rule.
Microsoft.Plurals = NO
# Microsoft.QuestionMarks: the repository does not adopt this punctuation preference.
Microsoft.QuestionMarks = NO
# Microsoft.Quotes: literal values in technical prose need their original punctuation.
Microsoft.Quotes = NO
# Microsoft.RangeTime: technical ranges follow their owning API or product contract.
Microsoft.RangeTime = NO
# Microsoft.Semicolon: the em dash replacement table explicitly permits semicolons.
Microsoft.Semicolon = NO
# Microsoft.SentenceLength: Shipfox.SentenceLength owns the measured limits.
Microsoft.SentenceLength = NO
# Microsoft.Spacing: the repository does not adopt this broader punctuation rule.
Microsoft.Spacing = NO
# Microsoft.Suspended: the repository does not adopt this broader vocabulary rule.
Microsoft.Suspended = NO
# Microsoft.Terms: its agent replacement is incorrect for Shipfox product vocabulary.
Microsoft.Terms = NO
# Microsoft.UIVerbs: the repository uses its product and API verbs deliberately.
Microsoft.UIVerbs = NO
# Microsoft.URLFormat: URL formatting follows the owning technical contract.
Microsoft.URLFormat = NO
# Microsoft.Units: technical units follow their owning API or product contract.
Microsoft.Units = NO
# Microsoft.Uppercase: adjacent acronyms are legitimate in engineering documentation.
Microsoft.Uppercase = NO
# Microsoft.Vocab: the project vocabulary is maintained by Shipfox rules.
Microsoft.Vocab = NO
# Microsoft.We: the repository does not ban first-person plural technical prose.
Microsoft.We = NO
# Microsoft.Wordiness: Shipfox.PlainWords owns the locally measured vocabulary.
Microsoft.Wordiness = NO

# Changeset summaries start with imperative verbs. The POS tagger reads them as noun clusters.
[.changeset/*.md]
Shipfox.NounCluster = NO

# Product docs carry the roadmap and glossary rules.
[apps/docs/content/**/*.{md,mdx}]
Google.Acronyms = suggestion
Google.Timeless = suggestion

# Reference pages may use passive voice when the actor is irrelevant.
[**/reference/**/*.{md,mdx}]
Google.Passive = NO

# Procedural documentation uses the shorter sentence limit.
[apps/docs/content/docs/{how-to,getting-started,tutorials}/**/*.{md,mdx}]
Shipfox.SentenceLength = NO
Shipfox.SentenceLengthProcedural = warning

[apps/docs/content/docs/getting-started.{md,mdx}]
Shipfox.SentenceLength = NO
Shipfox.SentenceLengthProcedural = warning
